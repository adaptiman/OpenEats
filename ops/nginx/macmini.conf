# OpenEats nginx on the Mac mini: plain HTTP inside Docker. Caddy (in ~/adapticlaw-edge) handles
# HTTPS, certificates and the cookbook.thesweeneys.org -> www redirect, and sends the request on
# here with X-Forwarded-Proto: https.

upstream api {
  server api:443;   # gunicorn's port inside the api container (plain HTTP despite the number)
}

# Keep Caddy's "this came in over HTTPS" header for Django; fall back to this hop's scheme when
# testing directly on http://localhost:8088.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
    listen      80;
    listen [::]:80;
    server_name www.cookbook.thesweeneys.org cookbook.thesweeneys.org localhost 127.0.0.1;
    server_tokens off;

    client_max_body_size 50m;   # recipe photo uploads

    location / {
        root /var/www/html/openeats-static/public-ui;
        try_files $uri $uri/ /index.html;
    }

    location /static/ {
        root /var/www/html/openeats-static/public-ui;
        gzip on;
        gzip_types text/plain text/xml text/css
            text/comma-separated-values
            text/javascript application/x-javascript
            application/javascript
            application/atom+xml;
        expires max;
    }

    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /admin/ {
        proxy_pass http://api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /static-files/ {
        root /var/www/html/openeats-static;
        try_files $uri /static-files/$uri;
    }

    location /site-media/ {
        root /var/www/html/openeats-static;
        try_files $uri /site-media/$uri;
    }
}
